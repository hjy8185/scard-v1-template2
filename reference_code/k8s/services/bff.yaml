apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff
  namespace: card-graphrag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bff
  template:
    metadata:
      labels:
        app: bff
    spec:
      serviceAccountName: bff-sa
      containers:
        - name: bff
          image: 000000000000.dkr.ecr.us-east-1.amazonaws.com/cg/bff:v6-latency
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: app-config
          resources:
            requests:
              cpu: 256m
              memory: 512Mi
            limits:
              cpu: 512m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: bff
  namespace: card-graphrag
spec:
  selector:
    app: bff
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
