  # Card Product Reference
  # ===========================================================================
  card_prod:
    ontology_class: CardProduct
    subsidiary: card
    description: "Card product master - defines all Shinhan Card products"
    description_ko: "카드상품 마스터 - 신한카드 전체 상품 정의"
    grain: "One row per card product"
    columns:
      상품코드: "Card product code (PK)"
      상품명: "Card product name"
      상품유형: "Product type (credit/check/prepaid)"
      연회비: "Annual fee amount"
      브랜드: "Card network brand (VISA/Master/Local)"
      출시일자: "Product launch date"
      판매상태: "Sales status (active/discontinued)"
