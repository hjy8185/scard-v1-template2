# =============================================================================
# Join Patterns
# =============================================================================
join_patterns:
  customer_cross_subsidiary:
    description: "Join customer data across all 4 subsidiaries"
    join_key: 그룹md번호
    example: |
      SELECT b.수신잔액, c.이용금액, l.유지계약건수, s.예탁자산
      FROM cln_m_cust_base_bank b
      JOIN cln_m_cust_base_card c ON b.그룹md번호 = c.그룹md번호 AND b.기준년월 = c.기준년월
      JOIN cln_m_cust_base_life l ON b.그룹md번호 = l.그룹md번호 AND b.기준년월 = l.기준년월
      JOIN cln_m_cust_base_sec s ON b.그룹md번호 = s.그룹md번호 AND b.기준년월 = s.기준년월
      WHERE b.기준년월 = '202401'

  customer_to_transactions:
    description: "Join customer master to transaction details"
    join_key: 그룹md번호
    partition_align: 기준년월
    example: |
      SELECT d.고객명, d.탑스클럽등급, t.이용건수, t.이용금액
      FROM m_cust_dim d
      JOIN trs_m_cust_card_txn_card t ON d.그룹md번호 = t.그룹md번호
      WHERE t.기준년월 = '202401'

  sole_proprietor_full:
    description: "Join sole proprietor data with merchant sales"
    join_keys: [그룹md번호, 개인사업자번호]
    example: |
      SELECT sp.사업자명, sp.업종코드, ms.매출금액, ms.매출건수
      FROM igd_m_soleprop_base sp
      JOIN trs_m_soleprop_merchant_sales_card ms
        ON sp.그룹md번호 = ms.그룹md번호
        AND sp.개인사업자번호 = ms.개인사업자번호
        AND sp.기준년월 = ms.기준년월
      WHERE sp.기준년월 = '202401'

  merchant_analysis:
    description: "Join merchant with delivery and industry data"
    join_key: 가맹점번호
    example: |
      SELECT f.프랜차이즈명, d.배달매출금액, d.일반매출금액, d.배달비중
      FROM com_m_merchant_franchise f
      JOIN trs_m_merchant_delivery d ON f.프랜차이즈코드 = d.가맹점번호
      WHERE d.기준년월 = '202401'
