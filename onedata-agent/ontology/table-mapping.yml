# =============================================================================
# Onedata Table-to-Ontology Mapping
# =============================================================================
# Maps 53 AWS Glue tables (database: ai_ready_v2) to ontology classes.
# Each table includes: ontology class, subsidiary, description, key columns,
# and join patterns.
# =============================================================================

database: ai_ready_v2
universal_join_key: 그룹md번호
partition_key_monthly: 기준년월
partition_key_daily: 기준일자

tables:
